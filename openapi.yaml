                                    type: string
                                  outro:
                                    type: string
                                  estimated_minutes:
                                    type: string
                                  instructions:
                                    type: string
                              question:
                                type: object
                                properties:
                                  instructions:
                                    type: string
                                  read_choices:
                                    type: string
                                  hidden_choices:
                                    type: string
                                  rephrase:
                                    type: string
                                  context:
                                    type: string
                              choice:
                                type: object
                                properties:
                                  read:
                                    type: string
                              scale:
                                type: object
                                properties:
                                  descriptions:
                                    type: string
                                  voicing:
                                    type: string
                              rules:
                                type: array
                                items:
                                  type: string
                              example:
                                type: object
                                properties:
                                  survey:
                                    type: object
                                    properties:
                                      voice: { type: object, properties: { intro: { type: object, properties: { en: { type: string }, et: { type: string }, ru: { type: string } } }, instructions: { type: object, properties: { en: { type: string }, et: { type: string }, ru: { type: string } } }, estimated_minutes: { type: integer } } }
                                  question:
                                    type: object
                                    properties:
                                      type: { type: string }
                                      name: { type: string }
                                      isRequired: { type: boolean }
                                      title: { type: object, properties: { en: { type: string }, et: { type: string }, ru: { type: string } } }
                                      choices: { type: array, items: { type: object, properties: { value: { type: string }, text: { type: object, properties: { en: { type: string }, et: { type: string }, ru: { type: string } } } } } }
                                      voice: { type: object, properties: { read_choices: { type: string }, instructions: { type: object, properties: { en: { type: string }, et: { type: string }, ru: { type: string } } } } }
                                  rating:
                                    type: object
                                    properties:
                                      type: { type: string }
                                      name: { type: string }
                                      isRequired: { type: boolean }
                                      rateMin: { type: integer }
                                      rateMax: { type: integer }
                                      title: { type: object, properties: { en: { type: string }, et: { type: string }, ru: { type: string } } }
                                      minRateDescription: { type: object, properties: { en: { type: string }, et: { type: string }, ru: { type: string } } }
                                      maxRateDescription: { type: object, properties: { en: { type: string }, et: { type: string }, ru: { type: string } } }
                          coverage:
                            type: string
                      question_types:
                        type: object
                        properties:
                          radiogroup:
                            type: object
                            properties:
                              standard_reference:
