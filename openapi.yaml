                                      properties: { name: { type: string }, title: { type: string }, elements: { type: array, items: { type: object, properties: { type: { type: string }, name: { type: string }, title: { type: string }, choices: { type: array, items: { type: object, properties: { value: { type: string }, text: { type: string } } } }, autoAdvanceIf: { type: string } } } } }
