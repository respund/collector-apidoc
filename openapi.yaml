                                properties:
                                  setsSurveyLanguage:
                                    type: object
                                    properties:
                                      type: { type: string }
                                      default: { type: boolean }
                                      label: { type: object, properties: { en: { type: string }, et: { type: string }, ru: { type: string } } }
                                      identify_by: { type: object, properties: { type: { type: string }, setsSurveyLanguage: { type: boolean } } }
                                      rules: { type: array, items: { type: string } }
                                      examples: { type: array, items: { type: object, properties: { label: { type: string }, question: { type: object, properties: { type: { type: string }, name: { type: string }, title: { type: object, properties: { en: { type: string }, et: { type: string }, ru: { type: string } } }, isRequired: { type: boolean }, setsSurveyLanguage: { type: boolean }, choices: { type: array, items: { type: object, properties: { value: { type: string }, text: { type: string } } } } } }, prerequisite: { type: string } } } }
                                      discovery: { type: string }
                                      mutation: { type: object, properties: { operation: { type: string }, target: { type: object, properties: { page: { type: string }, question: { type: string } } }, payload: { type: object, properties: { props: { type: object, properties: { setsSurveyLanguage: { type: boolean } } } } }, dry_run: { type: boolean }, expected_sequence: { type: integer }, include_snapshot: { type: boolean }, note: { type: string } } }
                                  autoAdvanceIf:
                                    type: object
                                    properties:
                                      type: { type: string }
                                      default: { type: string }
                                      max_length: { type: integer }
                                      delay_ms: { type: integer }
                                      expression_engine: { type: string }
                                      rules: { type: array, items: { type: string } }
                                      conditions: { type: array, items: { type: object, properties: { expression: { type: string }, meaning: { type: string } } } }
                                      localised_help: { type: object, properties: { en: { type: string }, et: { type: string }, ru: { type: string } } }
                                      examples: { type: array, items: { type: object, properties: { label: { type: string }, question: { type: object, properties: { type: { type: string }, name: { type: string }, choices: { type: array, items: { type: string } }, autoAdvanceIf: { type: string } } } } } }
                              renderers:
