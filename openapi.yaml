                            type: string
                          native_vs_extension:
                            type: string
                          extensions_are_not_upstream_properties:
                            type: boolean
                          renderAs:
                            type: string
                          package_availability:
                            type: string
                          auto_advance_priority:
                            type: string
                          runtime:
                            type: string
                          html_safety:
                            type: string
                          voice:
                            type: object
                            properties:
