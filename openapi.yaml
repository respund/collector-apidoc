                    success: false
                    message: 'Too Many Attempts.'
      tags:
        - 'External API'
    parameters:
      -
        in: path
        name: survey
        description: 'Survey UUID.'
        required: true
        schema:
          type: string
          examples:
            - 11111111-1111-4111-8111-111111111111
  /api/external/surveyjs-guide:
    get:
      summary: 'Get the Collector SurveyJS extension guide'
      operationId: getTheCollectorSurveyJSExtensionGuide
      description: "This read-only guide is not tied to a survey. It describes the pinned SurveyJS runtime, the Collector-only\nautoAdvanceIf and setsSurveyLanguage extensions, and renderer/package caveats. Use the optional question_type filter to return one entry."
      parameters:
        -
          in: query
          name: question_type
          description: 'Filter the guide to one documented question type.'
          required: false
          schema:
            type: string
            description: 'Filter the guide to one documented question type.'
            examples:
              - radiogroup
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      guide_version:
                        type: integer
                      surveyjs_version:
                        type: string
                      scope:
                        type: string
                      general:
                        type: object
                        properties:
