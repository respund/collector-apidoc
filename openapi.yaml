                examples:
                  -
                    success: true
                    message: 'SurveyJS guide retrieved successfully'
                    data:
                      guide_version: 1
                      surveyjs_version: 3.0.2
                      scope: 'Collector-specific SurveyJS behavior; not a full upstream API reference'
                      general:
                        schema_format: 'SurveyJS JSON'
                        native_vs_extension: 'SurveyJS owns the standard schema and rendering model. autoAdvanceIf and setsSurveyLanguage are Collector extensions, not upstream SurveyJS properties.'
                        extensions_are_not_upstream_properties: true
                        renderAs: 'renderAs selects a renderer for the same native question type; a non-native value requires the matching question package.'
                        package_availability: 'Documentation is not deployment availability discovery. Confirm that a required package is installed, enabled and valid before applying a renderAs value.'
                        auto_advance_priority: "If any question has a non-empty autoAdvanceIf, Collector disables SurveyJS survey-level autoAdvanceEnabled (including its goNextPageAutomatic alias) for that model. If none do, the schema's survey-level setting is unchanged."
                        runtime: 'Live surveys, public and admin previews, and unsaved schema previews use the shared Collector SurveyJS runtime. Preview answers, current page and language survive reload in tab-local browser storage; a new navigation/tab starts fresh, including copied opener storage. Preview never reads or writes respondent responses. Live respondent-code continuation uses the authenticated public-survey database draft; anonymous live draft identifiers are tab-local. There is no newtest parameter.'
                        html_safety: 'The shared runtime sanitizes final SurveyJS HTML and Markdown output with its configured DOMPurify protection. Schema HTML is not an execution API.'
                        voice:
                          applies_to: 'Headless interviews only (interviewer API). voice is a Collector extension, not an upstream SurveyJS property; SurveyJS rendering ignores it. Absent voice keeps current behavior.'
                          survey:
                            intro: 'Translated text spoken once after the greeting, before the first question.'
                            outro: 'Translated text spoken on completion.'
                            estimated_minutes: 'Positive integer; interview responses also compute progress.'
                            instructions: 'Translated interviewer-only guidance for the whole questionnaire (tone, pacing, general rules); returned as survey_voice.instructions, never spoken.'
                          question:
                            instructions: 'The standard interviewer-note field for study managers: translated, interviewer-only guidance for this question (what to pay attention to, how to probe or code); never spoken. Example ET: "Pane tähele: kui vastaja mainib mitut põhjust, küsi peamist."'
                            read_choices: 'Default read policy for choices without their own voice.read: always (default), never (respondent answers freely, interviewer codes it) or on_request. A rating with minRateDescription or maxRateDescription defaults to on_request; an explicit value wins.'
                            hidden_choices: "Unique existing choice values of a radiogroup or checkbox that are valid codes but never offered, such as don't know or refused. Equivalent to voice.read never on those choices; listing a choice whose own voice.read is not never is rejected."
                            rephrase: 'Translated alternative wording, used only when the respondent does not understand.'
                            context: 'Translated background (why it is asked, who ordered it) for answering respondent questions; never read as the question.'
                          choice:
                            read: "Per-choice voice.read on a radiogroup or checkbox choice: always (read when presenting the question), on_request (fallback such as don't know: not read initially, offered only when the respondent hesitates, asks or no option fits) or never (never offered, but saved when clearly stated). Choices without it use the question read_choices. Every returned choice carries read; hidden stays true for hidden_choices or own read never."
                          scale:
                            descriptions: 'A rating may have translated minRateDescription and maxRateDescription (same form as title). Interview questions return scale {min:{value,text},max:{value,text},step} (text null when absent; scale null for other types).'
                            voicing: 'Describe a scale by its endpoints instead of enumerating numbers: read the question and endpoint texts; read the numbers only when the respondent asks.'
                          rules:
