      operationId: readOneCompleteTopLevelQuestionByExactName
      description: "Same editor/ownership rules as agent-context. Optional page scopes lookup to that exact page name.\nMatches top-level page elements, like mutations; panels return their full nested content.\nNested questions are not separately addressable: read their containing page instead.\nNames are case-sensitive; URL-encode query values. Missing target is 404; multiple matches are 422, never silently chosen.\nsequence describes the effective snapshot (0 when no revision). No writes. This does not include cross-page dependencies.\nMalformed pages/elements return controller 422; missing survey uses Laravel's {message} 404 envelope."
