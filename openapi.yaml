                                  cards:
                                    type: object
                                    properties:
                                      schema: { type: object, properties: { type: { type: string }, renderAs: { type: string } } }
                                      required_package: { type: string }
                                      availability: { type: string }
                                      behavior: { type: string }
                      examples:
                        type: object
                        properties:
                          two_page_survey:
                            type: object
                            properties:
                              description:
                                type: string
                              schema:
                                type: object
