openapi: 3.1.0
info:
  title: 'Collector External API'
  description: 'Synthetic examples. Obtain the deployment URL and issued bearer key from the operator. See workflow.md and operations.md. All external routes share 120 requests/minute per validated key; invalid credentials share 60/minute per IP. HTTP 429 includes Retry-After (seconds), X-RateLimit-Limit, X-RateLimit-Remaining and X-RateLimit-Reset (Unix seconds). Normal middleware responses include limit/remaining; framework errors may not. Laravel validation uses {message,errors}, not the controller {success:false,message,errors?} envelope.'
  version: 1.0.0
servers:
  -
    url: 'https://collector.example.invalid'
tags:
  -
    name: 'External API'
    description: ''
  -
    name: 'Headless interviews'
    description: "\nInterviewer key required, plus survey ownership/explicit manager-key access. Sessions are bound to the creating key.\nStored schema/languages are pinned at start. Only successful requests are remembered for idempotency."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Operator-issued bearer key. Interview routes require interviewer; authoring routes require editor except latest revision. Survey ownership or explicit appAdmin/surveyAdmin key access is still required. Interviews are bound to the creating key; roles do not imply each other.'
security:
  -
    default: []
paths:
  '/api/external/surveys/{survey}/mutations':
    post:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                target:
                  minProperties: 1
                  type: object
                  description: 'Nonempty operation target; use a survey marker when no named target is consumed.'
                  properties: {}
                  examples:
                    -
                      page: feedback
                expected_sequence:
                  minimum: 0
                  type:
                    - integer
                    - 'null'
                  description: 'Nullable current sequence, minimum 0.'
                  examples:
                    - 0
                note:
                  maxLength: 255
                  type:
                    - string
                    - 'null'
                  description: 'Nullable revision note, maximum 255 characters.'
                  examples:
                    - 'Reviewed page addition'
                operation:
                  type: string
                  description: ''
                  enum:
                    - create_page
                    - upsert_page
                    - move_page
                    - delete_page
                    - insert_question
                    - upsert_question
                    - update_question_props
                    - move_question
                    - delete_question
                    - set_survey_languages
                    - set_survey_settings
                    - set_localized_text
                  examples:
                    - create_page
                payload:
                  type:
                    - object
                    - 'null'
                  description: 'Nullable operation-specific payload.'
                  properties: {}
                  examples:
                    -
                      page:
                        name: feedback
                        elements: []
                dry_run:
                  type:
                    - boolean
                    - 'null'
                  description: 'Nullable; true previews only, default false.'
                  examples:
                    - true
                include_snapshot:
                  type: boolean
                  description: 'Default true. Set false to omit data.survey.snapshot in preview and apply responses; validation, diff and sequence remain. Does not change the mutation or stored revision.'
                  examples:
                    - false
              type: object
              required:
                - operation
                - target
        required: true
      summary: 'Preview or apply one generic mutation'
      operationId: previewOrApplyOneGenericMutation
      description: "Requires editor and survey ownership or an explicit appAdmin/surveyAdmin key role. See operations.md for all 12 payloads.\nPreview does not persist: sequence/revision_id are null and latest_sequence is current. Apply advances sequence.\nUse expected_sequence 0 when no revision exists. Refetch/reconcile on 409 or timeout; never blindly replay insertions.\nNullable dry_run defaults false; nullable/omitted expected_sequence disables protection. Invalid snapshots/references return controller 422,\nwhile invalid envelopes return Laravel {message,errors} without success. Rate limits and retry headers: workflow.md."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: Preview
                    type: object
                    properties:
                      success:
                        type: boolean
                        examples:
                          - true
                      message:
                        type: string
                        examples:
                          - 'Survey mutation applied successfully'
                      data:
                        type: object
                        properties:
                          revision_id:
                            type:
                              - string
                              - 'null'
                            examples:
                              - null
                          sequence:
                            type:
                              - string
                              - 'null'
                            examples:
                              - null
                          latest_sequence:
                            type: integer
                            examples:
                              - 0
                          source:
                            type: string
                            examples:
                              - external_api
                          dry_run:
                            type: boolean
                            examples:
                              - true
                          actor:
                            type: object
                            properties:
                              user_id:
                                type: integer
                                examples:
                                  - 1
                              api_key_id:
                                type: string
                                examples:
                                  - 22222222-2222-4222-8222-222222222222
                          survey:
                            type: object
                            properties:
                              id:
                                type: string
                                examples:
                                  - 11111111-1111-4111-8111-111111111111
                              snapshot:
                                type: object
                                additionalProperties: true
                              supported_languages:
                                type: array
                                items:
                                  type: string
                                examples:
                                  -
                                    - en
                                    - et
                                    - ru
                              default_language:
                                type: string
                                examples:
                                  - en
                          validation:
                            type: object
                            properties:
                              valid:
                                type: boolean
                                examples:
                                  - true
                              errors:
                                type: array
                                examples:
                                  - []
                              has_valid_schema:
                                type: boolean
                                examples:
                                  - true
                              question_count:
                                type: integer
                                examples:
                                  - 0
                          diff:
                            type: array
                            items:
                              type: object
                              properties:
                                entity:
                                  type: string
                                  examples:
                                    - page
                                action:
                                  type: string
                                  examples:
                                    - created
                                target:
                                  type: string
                                  examples:
                                    - feedback
                                fields:
                                  type: array
                                  examples:
                                    - []
                            examples:
                              -
                                -
                                  entity: page
                                  action: created
                                  target: feedback
                                  fields: []
                    examples:
                      -
                        success: true
                        message: 'Survey mutation applied successfully'
                        data:
                          revision_id: null
                          sequence: null
                          latest_sequence: 0
                          source: external_api
                          dry_run: true
                          actor:
                            user_id: 1
                            api_key_id: 22222222-2222-4222-8222-222222222222
                          survey:
                            id: 11111111-1111-4111-8111-111111111111
                            snapshot:
                              pages:
                                -
                                  name: feedback
                                  elements: []
                            supported_languages:
                              - en
                              - et
                              - ru
                            default_language: en
                          validation:
                            valid: true
                            errors: []
                            has_valid_schema: true
                            question_count: 0
                          diff:
                            -
                              entity: page
                              action: created
                              target: feedback
                              fields: []
                  -
                    description: Applied
                    type: object
                    properties:
                      success:
                        type: boolean
                        examples:
                          - true
                      message:
                        type: string
                        examples:
                          - 'Survey mutation applied successfully'
                      data:
                        type: object
                        properties:
                          revision_id:
                            type: string
                            examples:
                              - 33333333-3333-4333-8333-333333333333
                          sequence:
                            type: integer
                            examples:
                              - 1
                          latest_sequence:
                            type: integer
                            examples:
                              - 1
                          source:
                            type: string
                            examples:
                              - external_api
                          dry_run:
                            type: boolean
                            examples:
                              - false
                          actor:
                            type: object
                            properties:
                              user_id:
                                type: integer
                                examples:
                                  - 1
                              api_key_id:
                                type: string
                                examples:
                                  - 22222222-2222-4222-8222-222222222222
                          survey:
                            type: object
                            properties:
                              id:
                                type: string
                                examples:
                                  - 11111111-1111-4111-8111-111111111111
                              snapshot:
                                type: object
                                additionalProperties: true
                              supported_languages:
                                type: array
                                items:
                                  type: string
                                examples:
                                  -
                                    - en
                                    - et
                                    - ru
                              default_language:
                                type: string
                                examples:
                                  - en
                          validation:
                            type: object
                            properties:
                              valid:
                                type: boolean
                                examples:
                                  - true
                              errors:
                                type: array
                                examples:
                                  - []
                              has_valid_schema:
                                type: boolean
                                examples:
                                  - true
                              question_count:
                                type: integer
                                examples:
                                  - 0
                          diff:
                            type: array
                            items:
                              type: object
                              properties:
                                entity:
                                  type: string
                                  examples:
                                    - page
                                action:
                                  type: string
                                  examples:
                                    - created
                                target:
                                  type: string
                                  examples:
                                    - feedback
                                fields:
                                  type: array
                                  examples:
                                    - []
                            examples:
                              -
                                -
                                  entity: page
                                  action: created
                                  target: feedback
                                  fields: []
                    examples:
                      -
                        success: true
                        message: 'Survey mutation applied successfully'
                        data:
                          revision_id: 33333333-3333-4333-8333-333333333333
                          sequence: 1
                          latest_sequence: 1
                          source: external_api
                          dry_run: false
                          actor:
                            user_id: 1
                            api_key_id: 22222222-2222-4222-8222-222222222222
                          survey:
                            id: 11111111-1111-4111-8111-111111111111
                            snapshot:
                              pages:
                                -
                                  name: feedback
                                  elements: []
                            supported_languages:
                              - en
                              - et
                              - ru
                            default_language: en
                          validation:
                            valid: true
                            errors: []
                            has_valid_schema: true
                            question_count: 0
                          diff:
                            -
                              entity: page
                              action: created
                              target: feedback
                              fields: []
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - false
                  message:
                    type: string
                    examples:
                      - 'Invalid API key'
                examples:
                  -
                    success: false
                    message: 'Invalid API key'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - false
                  message:
                    type: string
                    examples:
                      - Forbidden
                examples:
                  -
                    success: false
                    message: Forbidden
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples:
                      - 'No query results for model [App\Models\Survey].'
                examples:
                  -
                    message: 'No query results for model [App\Models\Survey].'
        409:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - false
                  message:
                    type: string
                    examples:
                      - 'Expected survey revision sequence 3 but latest sequence is 4.'
                  errors:
                    type: object
                    properties:
                      expected_sequence:
                        type: array
                        items:
                          type: string
                        examples:
                          -
                            - 'Expected survey revision sequence 3 but latest sequence is 4.'
                      latest_sequence:
                        type: integer
                        examples:
                          - 4
                examples:
                  -
                    success: false
                    message: 'Expected survey revision sequence 3 but latest sequence is 4.'
                    errors:
                      expected_sequence:
                        - 'Expected survey revision sequence 3 but latest sequence is 4.'
                      latest_sequence: 4
        422:
          description: ''
          content:
            application/json:
              schema:
                anyOf:
                  -
                    description: 'Envelope validation'
                    type: object
                    properties:
                      message:
                        type: string
                        examples:
                          - 'The target field is required.'
                      errors:
                        type: object
                        properties:
                          target:
                            type: array
                            items:
                              type: string
                            examples:
                              -
                                - 'The target field is required.'
                    examples:
                      -
                        message: 'The target field is required.'
                        errors:
                          target:
                            - 'The target field is required.'
                  -
                    description: 'Operation validation'
                    type: object
                    properties:
                      success:
                        type: boolean
                        examples:
