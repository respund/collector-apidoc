                                -
                                  label: conditional
                                  question:
                                    type: radiogroup
                                    name: visit_again
                                    choices:
                                      - 'yes'
                                      - 'no'
                                    autoAdvanceIf: "{visit_again} = 'yes'"
                                -
                                  label: 'cards renderer'
                                  question:
                                    type: radiogroup
                                    name: layout_choice
                                    choices:
                                      - compact
                                      - wide
                                    renderAs: cards
                                    autoAdvanceIf: 'true'
                                  required_package: core/radiogroup-cards
                                  availability: 'must be confirmed for the deployment'
                          renderers:
