openapi: 3.1.0
info:
  title: 'Collector External API'
  description: 'Synthetic examples. Obtain the deployment URL and issued bearer key from the operator. See workflow.md and operations.md. All external routes share 120 requests/minute per validated key; invalid credentials share 60/minute per IP. HTTP 429 includes Retry-After (seconds), X-RateLimit-Limit, X-RateLimit-Remaining and X-RateLimit-Reset (Unix seconds). Normal middleware responses include limit/remaining; framework errors may not. Laravel validation uses {message,errors}, not the controller {success:false,message,errors?} envelope.'
  version: 1.0.0
servers:
  -
    url: 'https://collector.example.invalid'
tags:
  -
    name: 'External API'
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Operator-issued bearer key. Editor is required except for latest revision; survey ownership or explicit appAdmin/surveyAdmin key access is still required.'
security:
  -
    default: []
paths:
  '/api/external/surveys/{survey}/mutations':
    post:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                target:
                  minProperties: 1
                  type: object
                  description: 'Nonempty operation target; use a survey marker when no named target is consumed.'
                  properties: {}
                  examples:
                    -
                      page: feedback
                expected_sequence:
                  minimum: 0
                  type:
                    - integer
                    - 'null'
                  description: 'Nullable current sequence, minimum 0.'
                  examples:
                    - 0
                note:
                  maxLength: 255
                  type:
                    - string
                    - 'null'
                  description: 'Nullable revision note, maximum 255 characters.'
                  examples:
                    - 'Reviewed page addition'
                operation:
                  type: string
                  description: ''
                  enum:
                    - create_page
                    - upsert_page
                    - move_page
                    - delete_page
                    - insert_question
                    - upsert_question
                    - update_question_props
                    - move_question
                    - delete_question
                    - set_survey_languages
                    - set_survey_settings
                    - set_localized_text
                  examples:
                    - create_page
                payload:
                  type:
                    - object
                    - 'null'
                  description: 'Nullable operation-specific payload.'
                  properties: {}
                  examples:
                    -
                      page:
                        name: feedback
                        elements: []
                dry_run:
                  type:
                    - boolean
                    - 'null'
                  description: 'Nullable; true previews only, default false.'
                  examples:
                    - true
                include_snapshot:
                  type: boolean
                  description: 'Default true. Set false to omit data.survey.snapshot in preview and apply responses; validation, diff and sequence remain. Does not change the mutation or stored revision.'
                  examples:
                    - false
              type: object
              required:
                - operation
                - target
        required: true
      summary: 'Preview or apply one generic mutation'
      operationId: previewOrApplyOneGenericMutation
      description: "Requires editor and survey ownership or an explicit appAdmin/surveyAdmin key role. See operations.md for all 12 payloads.\nPreview does not persist: sequence/revision_id are null and latest_sequence is current. Apply advances sequence.\nUse expected_sequence 0 when no revision exists. Refetch/reconcile on 409 or timeout; never blindly replay insertions.\nNullable dry_run defaults false; nullable/omitted expected_sequence disables protection. Invalid snapshots/references return controller 422,\nwhile invalid envelopes return Laravel {message,errors} without success. Rate limits and retry headers: workflow.md."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: Preview
                    type: object
                    properties:
                      success:
                        type: boolean
                        examples:
                          - true
                      message:
                        type: string
                        examples:
                          - 'Survey mutation applied successfully'
                      data:
                        type: object
                        properties:
                          revision_id:
                            type:
                              - string
                              - 'null'
                            examples:
                              - null
                          sequence:
                            type:
                              - string
                              - 'null'
                            examples:
                              - null
                          latest_sequence:
                            type: integer
                            examples:
                              - 0
                          source:
                            type: string
                            examples:
                              - external_api
                          dry_run:
                            type: boolean
                            examples:
                              - true
                          actor:
                            type: object
                            properties:
                              user_id:
                                type: integer
                                examples:
                                  - 1
                              api_key_id:
                                type: string
                                examples:
                                  - 22222222-2222-4222-8222-222222222222
                          survey:
                            type: object
                            properties:
                              id:
                                type: string
                                examples:
                                  - 11111111-1111-4111-8111-111111111111
                              snapshot:
                                type: object
                                additionalProperties: true
                              supported_languages:
                                type: array
                                items:
                                  type: string
                                examples:
                                  -
                                    - en
                                    - et
                                    - ru
                              default_language:
                                type: string
                                examples:
                                  - en
                          validation:
                            type: object
                            properties:
                              valid:
                                type: boolean
                                examples:
                                  - true
                              errors:
                                type: array
                                examples:
                                  - []
                              has_valid_schema:
                                type: boolean
                                examples:
                                  - true
                              question_count:
                                type: integer
                                examples:
                                  - 0
                          diff:
                            type: array
                            items:
                              type: object
                              properties:
                                entity:
                                  type: string
                                  examples:
                                    - page
                                action:
                                  type: string
                                  examples:
                                    - created
                                target:
                                  type: string
                                  examples:
                                    - feedback
                                fields:
                                  type: array
                                  examples:
                                    - []
                            examples:
                              -
                                -
                                  entity: page
                                  action: created
                                  target: feedback
                                  fields: []
                    examples:
                      -
                        success: true
                        message: 'Survey mutation applied successfully'
                        data:
                          revision_id: null
                          sequence: null
                          latest_sequence: 0
                          source: external_api
                          dry_run: true
                          actor:
                            user_id: 1
                            api_key_id: 22222222-2222-4222-8222-222222222222
                          survey:
                            id: 11111111-1111-4111-8111-111111111111
                            snapshot:
                              pages:
                                -
                                  name: feedback
                                  elements: []
                            supported_languages:
                              - en
                              - et
                              - ru
                            default_language: en
                          validation:
                            valid: true
                            errors: []
                            has_valid_schema: true
                            question_count: 0
                          diff:
                            -
                              entity: page
                              action: created
                              target: feedback
                              fields: []
                  -
                    description: Applied
                    type: object
                    properties:
                      success:
                        type: boolean
                        examples:
                          - true
                      message:
                        type: string
                        examples:
                          - 'Survey mutation applied successfully'
                      data:
                        type: object
                        properties:
                          revision_id:
                            type: string
                            examples:
                              - 33333333-3333-4333-8333-333333333333
                          sequence:
                            type: integer
                            examples:
                              - 1
                          latest_sequence:
                            type: integer
                            examples:
                              - 1
                          source:
                            type: string
                            examples:
                              - external_api
                          dry_run:
                            type: boolean
                            examples:
                              - false
                          actor:
                            type: object
                            properties:
                              user_id:
                                type: integer
                                examples:
                                  - 1
                              api_key_id:
                                type: string
                                examples:
                                  - 22222222-2222-4222-8222-222222222222
                          survey:
                            type: object
                            properties:
                              id:
                                type: string
                                examples:
                                  - 11111111-1111-4111-8111-111111111111
                              snapshot:
                                type: object
                                additionalProperties: true
                              supported_languages:
                                type: array
                                items:
                                  type: string
                                examples:
                                  -
                                    - en
                                    - et
                                    - ru
                              default_language:
                                type: string
                                examples:
                                  - en
                          validation:
                            type: object
                            properties:
                              valid:
                                type: boolean
                                examples:
                                  - true
                              errors:
                                type: array
                                examples:
                                  - []
                              has_valid_schema:
                                type: boolean
                                examples:
                                  - true
                              question_count:
                                type: integer
                                examples:
                                  - 0
                          diff:
                            type: array
                            items:
                              type: object
                              properties:
                                entity:
                                  type: string
                                  examples:
                                    - page
                                action:
                                  type: string
                                  examples:
                                    - created
                                target:
                                  type: string
                                  examples:
                                    - feedback
                                fields:
                                  type: array
                                  examples:
                                    - []
                            examples:
                              -
                                -
                                  entity: page
                                  action: created
                                  target: feedback
                                  fields: []
                    examples:
                      -
                        success: true
                        message: 'Survey mutation applied successfully'
                        data:
                          revision_id: 33333333-3333-4333-8333-333333333333
                          sequence: 1
                          latest_sequence: 1
                          source: external_api
                          dry_run: false
                          actor:
                            user_id: 1
                            api_key_id: 22222222-2222-4222-8222-222222222222
                          survey:
                            id: 11111111-1111-4111-8111-111111111111
                            snapshot:
                              pages:
                                -
                                  name: feedback
                                  elements: []
                            supported_languages:
                              - en
                              - et
                              - ru
                            default_language: en
                          validation:
                            valid: true
                            errors: []
                            has_valid_schema: true
                            question_count: 0
                          diff:
                            -
                              entity: page
                              action: created
                              target: feedback
                              fields: []
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - false
                  message:
                    type: string
                    examples:
                      - 'Invalid API key'
                examples:
                  -
                    success: false
                    message: 'Invalid API key'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - false
                  message:
                    type: string
                    examples:
                      - Forbidden
                examples:
                  -
                    success: false
                    message: Forbidden
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples:
                      - 'No query results for model [App\Models\Survey].'
                examples:
                  -
                    message: 'No query results for model [App\Models\Survey].'
        409:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - false
                  message:
                    type: string
                    examples:
                      - 'Expected survey revision sequence 3 but latest sequence is 4.'
                  errors:
                    type: object
                    properties:
                      expected_sequence:
                        type: array
                        items:
                          type: string
                        examples:
                          -
                            - 'Expected survey revision sequence 3 but latest sequence is 4.'
                      latest_sequence:
                        type: integer
                        examples:
                          - 4
                examples:
                  -
                    success: false
                    message: 'Expected survey revision sequence 3 but latest sequence is 4.'
                    errors:
                      expected_sequence:
                        - 'Expected survey revision sequence 3 but latest sequence is 4.'
                      latest_sequence: 4
        422:
          description: ''
          content:
            application/json:
              schema:
                anyOf:
                  -
                    description: 'Envelope validation'
                    type: object
                    properties:
                      message:
                        type: string
                        examples:
                          - 'The target field is required.'
                      errors:
                        type: object
                        properties:
                          target:
                            type: array
                            items:
                              type: string
                            examples:
                              -
                                - 'The target field is required.'
                    examples:
                      -
                        message: 'The target field is required.'
                        errors:
                          target:
                            - 'The target field is required.'
                  -
                    description: 'Operation validation'
                    type: object
                    properties:
                      success:
                        type: boolean
                        examples:
                          - false
                      message:
                        type: string
                        examples:
                          - 'Target page was not found.'
                    examples:
                      -
                        success: false
                        message: 'Target page was not found.'
        429:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - false
                  message:
                    type: string
                    examples:
                      - 'Too Many Attempts.'
                examples:
                  -
                    success: false
                    message: 'Too Many Attempts.'
      tags:
        - 'External API'
    parameters:
      -
        in: path
        name: survey
        description: 'Survey UUID.'
        required: true
        schema:
          type: string
          examples:
            - 11111111-1111-4111-8111-111111111111
  /api/external/surveyjs-guide:
    get:
      summary: 'Get the Collector SurveyJS extension guide'
      operationId: getTheCollectorSurveyJSExtensionGuide
      description: "This read-only guide is not tied to a survey. It describes the pinned SurveyJS runtime, the Collector-only\nautoAdvanceIf extension, and renderer/package caveats. Use the optional question_type filter to return one entry."
      parameters:
        -
          in: query
          name: question_type
          description: 'Filter the guide to one documented question type.'
          required: false
          schema:
            type: string
            description: 'Filter the guide to one documented question type.'
            examples:
              - radiogroup
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      guide_version:
                        type: integer
                      surveyjs_version:
                        type: string
                      scope:
                        type: string
                      general:
                        type: object
                        properties:
                          schema_format:
                            type: string
                          native_vs_extension:
                            type: string
                          extensions_are_not_upstream_properties:
                            type: boolean
                          renderAs:
                            type: string
                          package_availability:
                            type: string
                          auto_advance_priority:
                            type: string
                          runtime:
                            type: string
                          html_safety:
                            type: string
                          coverage:
                            type: string
                      question_types:
                        type: object
                        properties:
                          radiogroup:
                            type: object
                            properties:
                              standard_reference:
                                type: string
                              supported_renderers:
                                type: array
                                items:
                                  type: string
                              extensions:
                                type: object
                                properties:
                                  autoAdvanceIf:
                                    type: object
                                    properties:
                                      type: { type: string }
                                      default: { type: string }
                                      max_length: { type: integer }
                                      delay_ms: { type: integer }
                                      expression_engine: { type: string }
                                      rules: { type: array, items: { type: string } }
                                      conditions: { type: array, items: { type: object, properties: { expression: { type: string }, meaning: { type: string } } } }
                                      localised_help: { type: object, properties: { en: { type: string }, et: { type: string }, ru: { type: string } } }
                                      examples: { type: array, items: { type: object, properties: { label: { type: string }, question: { type: object, properties: { type: { type: string }, name: { type: string }, choices: { type: array, items: { type: string } }, autoAdvanceIf: { type: string } } } } } }
                              renderers:
                                type: object
                                properties:
                                  native:
                                    type: object
                                    properties:
                                      schema: { type: object, properties: { type: { type: string } } }
                                      availability: { type: string }
                                  cards:
                                    type: object
                                    properties:
                                      schema: { type: object, properties: { type: { type: string }, renderAs: { type: string } } }
                                      required_package: { type: string }
                                      availability: { type: string }
                                      behavior: { type: string }
                      examples:
                        type: object
                        properties:
                          two_page_survey:
                            type: object
                            properties:
                              description:
                                type: string
                              schema:
                                type: object
                                properties:
                                  title:
                                    type: string
                                  pages:
                                    type: array
                                    items:
                                      type: object
                                      properties: { name: { type: string }, title: { type: string }, elements: { type: array, items: { type: object, properties: { type: { type: string }, name: { type: string }, title: { type: string }, choices: { type: array, items: { type: object, properties: { value: { type: string }, text: { type: string } } } }, autoAdvanceIf: { type: string } } } } }
                          update_question_props_dry_run:
                            type: object
                            properties:
                              description:
                                type: string
                              request:
                                type: object
                                properties:
                                  operation:
                                    type: string
                                  target:
                                    type: object
                                    properties:
                                      page: { type: string }
                                      question: { type: string }
                                  payload:
                                    type: object
                                    properties:
                                      props: { type: object, properties: { autoAdvanceIf: { type: string } } }
                                  dry_run:
                                    type: boolean
                                  expected_sequence:
                                    type: integer
                              workflow:
                                type: string
                examples:
                  -
                    success: true
                    message: 'SurveyJS guide retrieved successfully'
                    data:
                      guide_version: 1
                      surveyjs_version: 3.0.2
                      scope: 'Collector-specific SurveyJS behavior; not a full upstream API reference'
                      general:
                        schema_format: 'SurveyJS JSON'
                        native_vs_extension: 'SurveyJS owns the standard schema and rendering model. autoAdvanceIf is a Collector extension and is not an upstream SurveyJS property.'
                        extensions_are_not_upstream_properties: true
                        renderAs: 'renderAs selects a renderer for the same native question type; a non-native value requires the matching question package.'
                        package_availability: 'Documentation is not deployment availability discovery. Confirm that a required package is installed, enabled and valid before applying a renderAs value.'
                        auto_advance_priority: "If any question has a non-empty autoAdvanceIf, Collector disables SurveyJS survey-level autoAdvanceEnabled (including its goNextPageAutomatic alias) for that model. If none do, the schema's survey-level setting is unchanged."
                        runtime: 'Live surveys, public and admin previews, and unsaved schema previews use the shared Collector SurveyJS runtime. Live answer persistence remains separate from preview rendering.'
                        html_safety: 'The shared runtime sanitizes final SurveyJS HTML and Markdown output with its configured DOMPurify protection. Schema HTML is not an execution API.'
                        coverage: 'This is the first detailed Collector extension guide for radiogroup questions, not an encyclopedia of every SurveyJS property or question type.'
                      question_types:
                        radiogroup:
                          standard_reference: 'https://surveyjs.io/form-library/documentation/api-reference/radio-button-question-model'
                          supported_renderers:
                            - native
                            - cards
                          extensions:
                            autoAdvanceIf:
                              type: string
                              default: ''
                              max_length: 4096
                              delay_ms: 300
                              expression_engine: SurveyJS
                              rules:
                                - 'The property is accepted only on type radiogroup, including a radiogroup rendered with renderAs cards.'
                                - 'A missing property or empty string disables the extension; the string true enables it for every otherwise permitted native radio selection.'
                                - 'Any other non-empty string is evaluated as a SurveyJS condition against the current survey answers.'
                                - 'A JSON boolean, null, number, array or object is invalid; do not coerce it to a string.'
                                - 'The expression is checked again after 300 ms and immediately before native nextPage(). Invalid expressions fail closed and manual navigation remains available.'
                                - 'Auto-advance requires one visible, answerable, editable question on the current page, a changed native pointer or touch radio selection, a non-empty answer, no active Other/comment clarification, a following visible page and successful native SurveyJS validation.'
                                - 'Asynchronous validation is guarded: if the answer, page, visibility, locale or editability changes while it runs, its later automatic navigation or completion is vetoed; custom page-changing handlers leave this extension manual.'
                                - 'The feature does not complete the last page, does not react to keyboard arrows or Space, restored or prefilled data, triggers, expressions, programmatic setValue, language changes or dynamic-panel template questions.'
                                - 'questionsOnPageMode inputPerPage, questionPerPage and questionOnPage are outside this first version; continue with native manual navigation.'
                              conditions:
                                -
                                  expression: 'true'
                                  meaning: 'Unconditional after a changed native radio selection.'
                                -
                                  expression: "{visit_again} = 'yes'"
                                  meaning: 'Advance only when the selected value is yes.'
                                -
                                  expression: "{plan} = 'standard' and {consent} = true"
                                  meaning: 'SurveyJS boolean and comparison expressions may combine answer conditions.'
                              localised_help:
                                en: 'Selecting an answer will automatically move to the next page.'
                                et: 'Vastuse valimine viib automaatselt järgmisele lehele.'
                                ru: 'Выбор ответа автоматически переведёт на следующую страницу.'
                              examples:
                                -
                                  label: unconditional
                                  question:
                                    type: radiogroup
                                    name: visit_again
                                    choices:
                                      - 'yes'
                                      - 'no'
                                    autoAdvanceIf: 'true'
                                -
                                  label: conditional
                                  question:
                                    type: radiogroup
                                    name: visit_again
                                    choices:
                                      - 'yes'
                                      - 'no'
                                    autoAdvanceIf: "{visit_again} = 'yes'"
                                -
                                  label: 'cards renderer'
                                  question:
                                    type: radiogroup
                                    name: layout_choice
                                    choices:
                                      - compact
                                      - wide
                                    renderAs: cards
                                    autoAdvanceIf: 'true'
                                  required_package: core/radiogroup-cards
                                  availability: 'must be confirmed for the deployment'
                          renderers:
                            native:
                              schema:
                                type: radiogroup
                              availability: 'SurveyJS native support is part of the application runtime.'
                            cards:
                              schema:
                                type: radiogroup
                                renderAs: cards
                              required_package: core/radiogroup-cards
                              availability: 'must be confirmed for the deployment'
                              behavior: 'Cards delegates to the native radiogroup; SurveyJS continues to own inputs, values, validation, comments, Other, keyboard behavior and accessibility.'
                      examples:
                        two_page_survey:
                          description: 'Complete synthetic SurveyJS schema: the first page can advance after yes; the second page remains a normal final page.'
                          schema:
                            title: 'Synthetic visit survey'
                            pages:
                              -
                                name: welcome
                                title: Welcome
                                elements:
                                  -
                                    type: radiogroup
                                    name: visit_again
                                    title: 'Would you visit again?'
                                    choices:
                                      - { value: 'yes', text: 'Yes' }
                                      - { value: 'no', text: 'No' }
                                    autoAdvanceIf: "{visit_again} = 'yes'"
                              -
                                name: details
                                title: Details
                                elements:
                                  -
                                    type: comment
                                    name: note
                                    title: 'Anything else?'
                        update_question_props_dry_run:
                          description: 'Synthetic guarded mutation that adds the conditional extension without changing the survey until apply is explicitly requested.'
                          request:
                            operation: update_question_props
                            target:
                              page: welcome
                              question: visit_again
                            payload:
                              props:
                                autoAdvanceIf: "{visit_again} = 'yes'"
                            dry_run: true
                            expected_sequence: 3
                          workflow: 'Review data.validation and data.diff, then apply the identical request with the same current expected_sequence only after approval; read back agent-context afterward.'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - false
                  message:
                    type: string
                    examples:
                      - 'Invalid API key'
                examples:
                  -
                    success: false
                    message: 'Invalid API key'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - false
                  message:
                    type: string
                    examples:
                      - Forbidden
                examples:
                  -
                    success: false
                    message: Forbidden
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples:
                      - 'SurveyJS guide is not available for this question type.'
                  errors:
                    type: object
                    properties:
                      question_type:
                        type: array
                        items:
                          type: string
                        examples:
                          -
                            - 'SurveyJS guide is not available for this question type.'
                examples:
                  -
                    message: 'SurveyJS guide is not available for this question type.'
                    errors:
                      question_type:
                        - 'SurveyJS guide is not available for this question type.'
        429:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - false
                  message:
                    type: string
                    examples:
                      - 'Too Many Attempts.'
                examples:
                  -
                    success: false
                    message: 'Too Many Attempts.'
      tags:
        - 'External API'
      requestBody:
        required: false
