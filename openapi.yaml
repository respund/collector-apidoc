  '/api/external/surveys/{survey}/participants/bulk':
    post:
      summary: 'Register participants in bulk'
      operationId: registerParticipantsInBulk
      description: "Requires editor and survey ownership or an explicit appAdmin/surveyAdmin key role. Duplicate payload tokens fail 422.\nValid batches return 200 with per-item conflicts, not an atomic all-or-nothing result. Replays do not update details.\nEvery item has the single-participant constraints. Rate limits and retry headers: workflow.md."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - true
                  message:
                    type: string
                    examples:
                      - 'Participants processed successfully'
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        examples:
                          - 3
                      created:
                        type: integer
                        examples:
                          - 1
                      already_registered:
                        type: integer
                        examples:
                          - 1
                      failed:
                        type: integer
                        examples:
                          - 1
                      participants:
                        type: array
                        items:
                          type: object
                          properties:
                            token:
                              type: string
                              examples:
                                - synthetic-participant-001
                            success:
                              type: boolean
                              examples:
                                - true
                            already_registered:
                              type: boolean
                              examples:
                                - false
                        examples:
                          -
                            -
                              token: synthetic-participant-001
                              success: true
                              already_registered: false
                            -
                              token: synthetic-participant-002
                              success: true
                              already_registered: true
                            -
                              token: synthetic-participant-003
                              success: false
                              error_code: token_already_assigned_to_other_survey
                              message: 'Token already belongs to another survey'
                examples:
                  -
                    success: true
                    message: 'Participants processed successfully'
                    data:
                      total: 3
                      created: 1
                      already_registered: 1
                      failed: 1
                      participants:
