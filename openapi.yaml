                        success: false
                        message: 'Target page was not found.'
        429:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - false
                  message:
                    type: string
                    examples:
                      - 'Too Many Attempts.'
                examples:
