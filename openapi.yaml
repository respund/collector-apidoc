  '/api/external/surveys/{survey}/pages':
    get:
      summary: 'Read one complete page by exact name'
      operationId: readOneCompletePageByExactName
      description: "Requires editor and survey ownership or an explicit appAdmin/surveyAdmin key role.\nReturns the effective page including all nested content, not the whole survey. Names are case-sensitive.\nUse query parameters (URL-encoded) so names containing slashes or dots are supported.\nsequence describes this snapshot; 0 means no revision. Missing target is 404; duplicate matches or malformed pages/elements are 422.\nMissing survey uses Laravel's {message} 404 envelope.\nRead-only: no revision, response or survey changes."
      parameters:
        -
          in: query
          name: name
          description: 'Exact page name.'
          required: true
          schema:
            type: string
            description: 'Exact page name.'
            examples:
              - feedback
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - true
                  message:
                    type: string
                    examples:
                      - Success
                  data:
                    type: object
                    properties:
                      survey_id:
                        type: string
                        examples:
                          - 11111111-1111-4111-8111-111111111111
                      sequence:
                        type: integer
                        examples:
                          - 1
                      page:
                        type: object
                        additionalProperties: true
                examples:
                  -
                    success: true
                    message: Success
                    data:
                      survey_id: 11111111-1111-4111-8111-111111111111
                      sequence: 1
                      page:
                        name: feedback
                        elements:
                          -
                            type: text
                            name: comment
                            title: 'Your comment'
        401:
